version: 1

providers:
  github:
    kind: github
    config:
      owner: zloeber
      repo: resume

secrets:
  - name: gist_publish_token
    kind: static
    description: |
      GitHub Actions repository secret used only for gist publishing. Manual token creation required:
      - Go to **GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)**.
      - Click **Generate new token (classic)**.
      - Give it a descriptive name and expiration.
      - Select **only** this scope:
        - ✅ `gist` – Create and modify gists.
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: zloeber
          repo: resume
          name: TOKEN
